<script>
"use strict";
let DATA = JSON.parse(document.getElementById('boardData').textContent);
const BRANCHES = DATA.branches;
let MAIN = BRANCHES[0];
let current = MAIN;
function D(){ return DATA.insts[current] || DATA.insts[MAIN]; }

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function tw(s, fs){ let w=0; for(const ch of String(s)){ w += ch.charCodeAt(0)>255 ? fs : fs*0.56; } return w; }
function trunc(s, fs, maxW){ s=String(s); if(tw(s,fs)<=maxW) return s; let o=''; for(const ch of s){ if(tw(o+ch+'…',fs)>maxW) return o+'…'; o+=ch; } return o; }
const pct  = (x,d=2) => (x==null||isNaN(x)) ? '—' : (x*100).toFixed(d)+'%';
const pp   = x => (x==null||isNaN(x)) ? null : (x>=0?'+':'') + (x*100).toFixed(2) + 'pp';
const yi   = v => v.toFixed(2)+'亿';
const chgColor = v => v==null ? '#8a97a8' : (v>0 ? '#d6452b' : (v<0 ? '#2e8b57' : '#8a97a8'));
const chgText  = v => v==null ? '—' : (Math.abs(v)<1e-9 ? '持平' : pp(v));

/* ---------- SVG 片段 ---------- */
let Y = 0;
const W = 760, M = 16, CW = W - M*2;      // 728 内容宽
const parts = [];
const add = s => parts.push(s);
function txt(x,y,s,fs,fill,opts={}){
  const a = [`x="${x}" y="${y}" font-size="${fs}" fill="${fill}"`];
  if(opts.bold) a.push('font-weight="700"');
  if(opts.anchor) a.push(`text-anchor="${opts.anchor}"`);
  if(opts.family) a.push(`font-family="${opts.family}"`);
  add(`<text ${a.join(' ')}>${esc(s)}</text>`);
}
function rect(x,y,w,h,fill,opts={}){
  const a=[`x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"`];
  if(opts.rx!=null) a.push(`rx="${opts.rx}"`);
  if(opts.stroke) a.push(`stroke="${opts.stroke}" stroke-width="${opts.sw||1}"`);
  if(opts.dash) a.push(`stroke-dasharray="${opts.dash}"`);
  if(opts.opacity!=null) a.push(`opacity="${opts.opacity}"`);
  add(`<rect ${a.join(' ')}/>`);
}
function line(x1,y1,x2,y2,stroke,sw,opacity=0.72){
  add(`<path d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}" opacity="${opacity}"/>`);
}
function arrow(x,y,color){          // 指向 (x,y) 的水平右向小箭头
  const s=4.2;
  add(`<path d="M ${x} ${y} L ${x-s} ${y-s*0.75} L ${x-s} ${y+s*0.75} Z" fill="${color}" stroke="none" opacity="0.9"/>`);
}
function sectionTitle(t, y, accent='#1f4e79'){
  rect(M, y, 4, 17, accent, {rx:2});
  txt(M+11, y+13.5, t, 14.5, '#1f4e79', {bold:1});
  return y + 30;
}
function bar(x,y,w,h,ratio,color){
  rect(x,y,w,h,'#e8edf3',{rx:h/2});
  const ww = Math.max(0, Math.min(1, ratio)) * w;
  if(ww>0.5) rect(x,y,ww,h,color,{rx:h/2});
}

/* ---------- 1. 头部 ---------- */
function drawHeader(){
  rect(0,0,W,66,'#17456e');
  rect(0,66,W,3,'#2e75b6');
  txt(M,34, '杭州分行交易结算「三率」看板',22,'#ffffff',{bold:1});
  txt(W-M,30,'数据日期 ' + DATA.dateLabel,13,'#cfe0ef',{anchor:'end'});
  txt(W-M,50,'单位：亿元 / %',11,'#9db8cf',{anchor:'end'});
  return 92;
}

/* ---------- 2. KPI 四卡 ---------- */
function drawKPI(branch){
  const k = D().kpi;
  const gap = 10, cw = (CW - gap*3)/4, h = 126, y0 = Y;
  const cards = [
    { t:'收款承接率完成情况', c:'#d6452b', d:k.sk, type:'rate' },
    { t:'付款承接率完成情况', c:'#1f77b4', d:k.fk, type:'rate' },
    { t:'受托支付承接率完成情况', c:'#2e8b57', d:k.st, type:'rate' },
    { t:'对公融资结算量完成情况', c:'#7b5ea7', d:k.xd, type:'amt' },
  ];
  cards.forEach((c,i)=>{
    const x = M + i*(cw+gap);
    rect(x,y0,cw,h,'#ffffff',{rx:8,stroke:'#dde5ee',sw:1});
    rect(x,y0,cw,4,c.c,{rx:2});
    txt(x+11,y0+24,c.t,12,'#5a6b7f');
    if(c.type==='rate'){
      txt(x+11,y0+43,'承接率',11,'#8a97a8');
      txt(x+11,y0+70,pct(c.d.rate),25,c.c,{bold:1});
      const chg = c.d.chg;
      if(chg==null){
        txt(x+11,y0+88,'较25年基数 —',11,'#8a97a8');
      } else {
        const sign = chg>=0 ? '+' : '';
        txt(x+11,y0+88,`较25年基数 ${sign}${chg.toFixed(2)}pp`,11.5, chg>=0?'#d6452b':'#2e8b57',{bold:1});
      }
      const done = c.d.done;
      bar(x+11,y0+96,cw-22,5,done==null?0:done,c.c);
      const dl = (D().doneLabels||{})[(i===2?'st':(i===3?'xd':''))] || '完成率';
    txt(x+11,y0+116,dl+' ',11,'#5a6b7f');
      txt(x+14+tw(dl,11),y0+116,pct(done,1),11.5, done==null?'#8a97a8':(done<0?'#2e8b57':(done>=1?'#d6452b':'#d68910')),{bold:1});
    } else {
      txt(x+11,y0+43,'结算量',11,'#8a97a8');
      txt(x+11,y0+70,(c.d.amt==null?'—':c.d.amt.toFixed(0))+' 亿',25,c.c,{bold:1});
      if(c.d.target!=null) txt(x+11,y0+88,`全年任务 ${c.d.target.toFixed(0)} 亿`,11,'#8a97a8');
      const done = c.d.done;
      bar(x+11,y0+96,cw-22,5,done==null?0:done,c.c);
      const dl = (D().doneLabels||{})[(i===2?'st':(i===3?'xd':''))] || '完成率';
    txt(x+11,y0+116,dl+' ',11,'#5a6b7f');
      txt(x+14+tw(dl,11),y0+116,pct(done,1),11.5, done==null?'#8a97a8':(done>=1?'#d6452b':'#d68910'),{bold:1});
    }
  });
  Y = y0 + h + 18;
}

/* ---------- 3.5 组内排名（通报同组机构 排名/承接率/完成率/资金总量） ---------- */
const doneColor = v => v==null ? '#8a97a8' : (v>=1 ? '#d6452b' : '#2e8b57');   // 高=红 低=绿
function drawInstTable(x,y,w,rows,rateKey,denomKey){
  rect(x,y,w,24,'#eef3f8',{rx:0});
  txt(x+12,y+16,'机构',11.5,'#5a6b7f');
  txt(x+w-140,y+16,'资金总量',11.5,'#5a6b7f',{anchor:'end'});
  txt(x+w-78,y+16,'承接率',11.5,'#5a6b7f',{anchor:'end'});
  txt(x+w-10,y+16,'增量完成率',11.5,'#5a6b7f',{anchor:'end'});
  let yy = y+24;
  rows.forEach((r,i)=>{
    const sel = r.name === MAIN;                       // 高亮本看板机构
    if(i%2===1 && !sel) rect(x,yy,w,24,'#f7fafc');
    if(sel) rect(x,yy,w,24,'#fdecec');
    const bold = sel;
    txt(x+12,yy+16,(i+1)+'  '+trunc(r.name,12,150),12, sel?'#b03030':'#33475b',{bold});
    const den = r[denomKey];
    txt(x+w-140,yy+16,den==null?'—':den.toFixed(1)+'亿',11.5,'#5a6b7f',{bold, anchor:'end'});
    txt(x+w-78,yy+16,pct(r[rateKey]),12, sel?'#b03030':'#33475b',{bold, anchor:'end'});
    const dv = r[rateKey==='skRate'?'skDone':'fkDone'];
    const dvC = dv==null ? '#33475b' : (i<3 ? '#d6452b' : (dv<0 ? '#2e8b57' : '#33475b'));  // 前三红 负数绿 其余黑
    txt(x+w-10,yy+16,pct(dv,1),12,dvC,{bold, anchor:'end'});
    yy += 24;
  });
  rect(x,y,w,yy-y+1,'none',{stroke:'#dde5ee',sw:1});
  return yy;
}
function drawRankPair(rows, label){
  const t0 = Y, half = (CW-20)/2;
  rect(M, t0, 4, 17, '#d6452b', {rx:2});
  txt(M+11, t0+13.5, label+'  收款承接率', 14.5, '#1f4e79', {bold:1});
  rect(M+half+20, t0, 4, 17, '#1f77b4', {rx:2});
  txt(M+half+31, t0+13.5, label+'  付款承接率', 14.5, '#1f4e79', {bold:1});
  Y = t0 + 30;
  const tY = Y;
  const rowsSK = [...rows].sort((a,b)=>(b.skDone??-Infinity)-(a.skDone??-Infinity));
  const rowsFK = [...rows].sort((a,b)=>(b.fkDone??-Infinity)-(a.fkDone??-Infinity));
  const h1 = drawInstTable(M, tY, half, rowsSK, 'skRate','skDenom');
  const h2 = drawInstTable(M+half+20, tY, half, rowsFK, 'fkRate','fkDenom');
  Y = Math.max(h1,h2) + 22;
}
function drawInst(){
  const Dv = D();
  const isMain = !!Dv.hasChildren;        // 分行本级（温州/绍兴/台州）
  const isChild = !!Dv.childOf;           // 辖内子机构
  if(isMain && Dv.grpTable && Dv.grpTable.length) drawRankPair(Dv.grpTable, '组内排名');
  const instRows = Dv.instTable||[];
  if(instRows.length) drawRankPair(instRows, (isMain||isChild) ? '辖内排名' : '组内排名');
}

/* ---------- 4. 大户未承接两表（上下整幅，客户全名；未承接金额紧跟客户名，三列均匀分布） ---------- */
function drawTopTable(x,y,w,rows,side){
  const z1 = x + 330 + (w-342)/3, z2 = x + 330 + (w-342)*2/3;
  const cols = [['客户',x+12,'start'],['未承接金额',z1,'middle'],['承接率',z2,'middle']];
  rect(x,y,w,24,'#eef3f8');
  cols.forEach(c=> txt(c[1],y+16,c[0],11.5,'#5a6b7f',{anchor:c[2]}));
  let yy = y+24;
  if(!rows.length){ txt(x+w/2, yy+20, '本机构暂无数据', 12, '#8a97a8', {anchor:'middle'}); yy+=40; }
  rows.forEach((r,i)=>{
    if(i%2===1) rect(x,yy,w,24,'#f7fafc');
    if(i===0) rect(x,yy,w,24,'#fdecec');
    txt(x+12,yy+16,trunc(r.name,11.5,300),11.5, i===0?'#b03030':'#33475b',{bold:i===0});
    txt(z1,yy+16,yi(r.un),11.5,'#33475b',{bold:i===0,anchor:'middle'});
    txt(z2,yy+16,pct(r.rate),11.5,'#33475b',{anchor:'middle'});
    yy += 24;
  });
  rect(x,y,w,yy-y+1,'none',{stroke:'#dde5ee',sw:1});
  return yy;
}
function drawTop(){
  const sk = D().skTop||[], fk = D().fkTop||[];
  Y = sectionTitle('大户未承接（按未承接金额排序）', Y, '#d68910');
  // 收款端
  rect(M, Y, CW, 20, '#f4f8fb');
  txt(M+9, Y+14.5, '收款端', 12.5, '#1f4e79', {bold:1});
  Y += 26;
  Y = drawTopTable(M, Y, CW, sk, 'sk') + 18;
  // 付款端
  rect(M, Y, CW, 20, '#f4f8fb');
  txt(M+9, Y+14.5, '付款端', 12.5, '#1f4e79', {bold:1});
  Y += 26;
  Y = drawTopTable(M, Y, CW, fk, 'fk') + 22;
}

/* ---------- 5. 头部断链图谱（中转节点展开成员公司版式） ---------- */
function strokeW(v){ return v<3?1.5 : v<10?2.2 : v<30?3.5 : v<100?5 : 7; }
function drawGraphCard(g, y0){
  const boxW = 200, boxH = 34, rowH = 42;
  const midW = 236, memH = 40, memGap = 6;
  const pad = 12, headH = 62;
  const nm = g.members.length;
  const leftH = Math.max(g.payers.length,1)*rowH;
  const rightH = Math.max(g.payees.length,1)*rowH;
  const midH = 20 + nm*(memH+memGap) + (g.membersMore>0?15:0) + 24;
  const contentH = Math.max(leftH, rightH, midH, 3*rowH);
  const cardH = headH + contentH + pad*2;
  rect(M, y0, CW, cardH, '#ffffff', {rx:8, stroke:'#dde5ee', sw:1});
  rect(M, y0, 4, cardH, '#e0a33c', {rx:2});
  // 头部
  // 方向口径：起点/终点客户均为中信账户，中转节点为他行账户
  // 流向中转节点（g.in）= 流出资金；中转节点转至终点（g.out）= 流入资金；净流出 = 滞留他行的资金
  const net = g.in - g.out;
  const netTxt = (net>=0? '净流出 ' : '净流入 ') + Math.abs(net).toFixed(1) + '亿';
  const netC = net>=0 ? '#d6452b' : '#2e8b57';
  txt(M+14, y0+21, (g.group?'断链集团：':'断链客户：') + trunc(g.name,14,300), 14, '#1f4e79', {bold:1});
  const netW = tw(netTxt,12);
  txt(W-M-14-netW-10, y0+21, `流出资金 ${g.in.toFixed(1)}亿 ｜ 流入资金 ${g.out.toFixed(1)}亿`, 12, '#5a6b7f', {anchor:'end'});
  txt(W-M-14, y0+21, netTxt, 12, netC, {bold:1, anchor:'end'});
  txt(M+14, y0+39, `归属机构：${g.bank}　·　连线粗细 = 金额规模`, 10.5, '#8a97a8');
  txt(M+14, y0+57, '起点客户（中信账户 · 资金流出 →）', 10, '#2e75b6', {bold:1});
  txt(W-M-14, y0+57, '终点客户（中信账户 · ← 资金流入）', 10, '#2e75b6', {bold:1, anchor:'end'});
  // 布局
  const top = y0 + headH + pad;
  const lx = M+14, rx2 = W-M-14-boxW;
  const cx = (W-midW)/2;
  const leftY0 = top + (contentH-leftH)/2;
  const rightY0 = top + (contentH-rightH)/2;
  const midY0 = top + (contentH-midH)/2;
  const memY = i => midY0 + 20 + i*(memH+memGap);
  const memCy = i => memY(i) + memH/2;
  // 连线（先线后盒）：每个对手盒按 ms 扇出连线到各成员，线宽∝金额
  g.payers.forEach((p,i)=>{
    const ls = (p.ms && p.ms.length) ? p.ms : [[p.m, p.v]];
    ls.forEach(l => { line(lx+boxW, leftY0+i*rowH+boxH/2, cx, memCy(l[0]), '#2e75b6', strokeW(l[1])); arrow(cx-3, memCy(l[0]), '#2e75b6'); });
  });
  g.payees.forEach((p,i)=>{
    const ls = (p.ms && p.ms.length) ? p.ms : [[p.m, p.v]];
    ls.forEach(l => { line(cx+midW, memCy(l[0]), rx2, rightY0+i*rowH+boxH/2, '#2e8b57', strokeW(l[1])); arrow(rx2-3, rightY0+i*rowH+boxH/2, '#2e8b57'); });
  });
  // 付款方盒
  g.payers.forEach((p,i)=>{
    const y = leftY0 + i*rowH;
    rect(lx, y, boxW, boxH, '#eaf1f9', {rx:6, stroke:'#2e75b6', sw:1});
    txt(lx+10, y+14.5, trunc(p.n,11.5,boxW-20), 11.5, '#17456e', {bold:1});
    txt(lx+10, y+28.5, '¥ ' + yi(p.v), 10.5, '#5a6b7f');
  });
  if(g.payersMore>0) txt(lx+boxW/2, leftY0+g.payers.length*rowH+4, `…其他 ${g.payersMore} 户`, 10.5, '#8a97a8', {anchor:'middle'});
  // 中转节点容器（橙色虚线，成员公司展开）
  rect(cx, midY0, midW, midH, '#fdf6e3', {rx:8, stroke:'#e0a33c', sw:1.2, dash:'5,4'});
  txt(cx+midW/2, midY0+14, `中转节点 · 他行账户（${nm}家${g.membersMore>0?'+':''}）`, 11, '#c07f1a', {bold:1, anchor:'middle'});
  g.members.forEach((m,i)=>{
    const y = memY(i);
    rect(cx+10, y, midW-20, memH, '#fffdf5', {rx:6, stroke:'#e8c98a', sw:1});
    txt(cx+18, y+15.5, trunc(m.n,11,midW-36), 11, '#8a5a12', {bold:1});
    txt(cx+18, y+31, `转入 ${m.i.toFixed(1)}亿 · 转出 ${m.o.toFixed(1)}亿`, 10, '#8a6d3b');
  });
  if(g.membersMore>0) txt(cx+midW/2, memY(nm)+2, `…其他 ${g.membersMore} 家`, 10, '#b08a4a', {anchor:'middle'});
  txt(cx+midW/2, midY0+midH-8,
      `流出资金 ${g.in.toFixed(1)}亿 · 流入资金 ${g.out.toFixed(1)}亿 · ${net>=0?'净流出':'净流入'} ${Math.abs(net).toFixed(1)}亿`,
      10, netC, {bold:1, anchor:'middle'});
  // 收款方盒
  g.payees.forEach((p,i)=>{
    const y = rightY0 + i*rowH;
    rect(rx2, y, boxW, boxH, '#eaf1f9', {rx:6, stroke:'#2e75b6', sw:1});
    txt(rx2+10, y+14.5, trunc(p.n,11.5,boxW-20), 11.5, '#17456e', {bold:1});
    txt(rx2+10, y+28.5, '¥ ' + yi(p.v), 10.5, '#5a6b7f');
  });
  if(g.payeesMore>0) txt(rx2+boxW/2, rightY0+g.payees.length*rowH+4, `…其他 ${g.payeesMore} 户`, 10.5, '#8a97a8', {anchor:'middle'});
  return y0 + cardH + 14;
}
function drawGraphs(){
  const gs = D().graphs||[];
  Y = sectionTitle('头部断链图谱（前十大 · 集团与单户按流出资金排序）', Y, '#e0a33c');
  if(D().conc!=null){
    txt(W-M, Y-16, `前${gs.length}大（集团/单户）合计占全部断链流出资金 ${D().conc}%`, 11, '#8a97a8', {anchor:'end'});
  }
  if(!gs.length){ txt(W/2, Y+8, '本机构暂无符合口径的断链中转节点', 12, '#8a97a8', {anchor:'middle'}); Y += 30; return; }
  gs.forEach(g => { Y = drawGraphCard(g, Y); });
  Y += 8;
}

/* ---------- 6. 页脚 ---------- */
function drawFooter(){
  const today = new Date();
  const ds = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  rect(0, Y, W, 62, '#f0f3f7');
  rect(0, Y, W, 1, '#dde5ee');
  txt(M, Y+18, '口径汇总：KPI · 来自杭州分行三率通报（'+DATA.dateLabel+'）'+(D().dateNote?'｜'+D().dateNote:'')+'｜ 大户未承接 · 来自收付款承接明细，同一客户多行明细加总求和，承接率=承接资金合计/全部资金合计', 10.5, '#7a8ba0');
  txt(M, Y+34, '断链图谱 · 断点含义：起点/终点客户均为中信账户，中转节点为他行账户；起点客户资金流出中信账户进入中转节点（断点），再由中转节点流向终点客户', 10.5, '#7a8ba0');
  txt(M, Y+50, '图谱目的：推动断点客户改用中信账户收付、消除断点；金额为真实资金流（按客户对去重·双腿并集）；集团按关键字/字号归集，并经企查查穿透实控人校验（实控人不一致的集团解散/成员退回单户），与单户统一按流出资金排序取前十 ｜ 生成于 '+ds, 10.5, '#7a8ba0');
  Y += 62;
}

/* ---------- 渲染 ---------- */
function renderBoard(branch){
  current = branch;
  MAIN = branch;
  parts.length = 0; Y = 0;
  Y = drawHeader();
  // 二级标题：当前筛选机构（浅色底，紧贴大标题下方、四卡上方）
  rect(M, Y+2, 5, 22, '#17456e', {rx:2.5});
  txt(M+14, Y+20, current, 19, '#17456e', {bold:1});
  Y += 40;
  drawKPI(branch);
  drawInst();
  drawTop();
  drawGraphs();
  drawFooter();
  const H = Y;
  parts.unshift(`<rect x="0" y="0" width="${W}" height="${H}" fill="#f4f6f9"/>`);
  const svg = `<svg id="board" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">${parts.join('')}</svg>`;
  document.getElementById('boardBox').innerHTML = svg;
}

/* ---------- 导出 PNG（2 倍清晰度） ---------- */
function exportPNG(branch){
  return new Promise(resolve=>{
    renderBoard(branch);
    const svg = document.getElementById('board');
    const xml = new XMLSerializer().serializeToString(svg);
    const W2 = 2*W, H2 = 2*parseFloat(svg.getAttribute('height'));
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = W2; cv.height = H2;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#f4f6f9'; ctx.fillRect(0,0,W2,H2);
      ctx.drawImage(img,0,0,W2,H2);
      cv.toBlob(b=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `${MAIN}三率看板.png`;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
        resolve();
      },'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  });
}

/* ---------- 事件绑定 ---------- */
/* ---------- 机构筛选 ---------- */
(function(){
  const sel = document.getElementById('instSel');
  DATA.groups.forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g.name;
    g.insts.forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value = MAIN;
  const badge = document.getElementById('curBadge');
  badge.textContent = '当前：' + MAIN;
  sel.addEventListener('change', e => {
    MAIN = e.target.value;
    renderBoard(MAIN);
    badge.textContent = '当前：' + MAIN;
    window.scrollTo(0, 0);
  });
})();
document.getElementById('btnExport').addEventListener('click', ()=> exportPNG(current).then(()=>renderBoard(current)));
renderBoard(MAIN);
</script>
